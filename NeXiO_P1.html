<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NeXiO - Digital Engineering Platform</title>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
        font-family: 'Segoe UI', 'Roboto', 'Open Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .slide-container {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1b2a 100%);
        flex-shrink: 0;
        transform: scale(var(--scale, 1));
        transform-origin: center center;
    }
    
    #particles {
        position: absolute;
        inset: 0;
        width: 1280px;
        height: 720px;
        pointer-events: none;
        z-index: 1;
    }
    
    .bg-pattern {
        position: absolute;
        inset: 0;
        opacity: 0.05;
        background-image: 
            radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.3) 0%, transparent 50%),
            radial-gradient(circle at 80% 20%, rgba(45, 212, 191, 0.3) 0%, transparent 50%);
        pointer-events: none;
    }
    
    .grid-lines {
        position: absolute;
        inset: 0;
        background-image: 
            linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
    }
    
    .main-content {
        position: absolute;
        top: 120px;
        left: 0;
        width: 1280px;
        height: 520px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 2;
    }
    
    .logo-section {
        position: absolute;
        top: 40px;
        left: 60px;
        display: flex;
        align-items: center;
        gap: 15px;
        z-index: 3;
        animation: slideInLeft 0.8s ease-out;
    }
    
    .logo-icon {
        width: 50px;
        height: 50px;
        background: linear-gradient(135deg, #3b82f6, #2dd4bf);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
        box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5);
        animation: logoPulse 3s ease-in-out infinite;
    }
    
    @keyframes logoPulse {
        0%, 100% { box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5); }
        50% { box-shadow: 0 4px 30px rgba(45, 212, 191, 0.8), 0 0 40px rgba(45, 212, 191, 0.4); }
    }
    
    .logo-text {
        font-size: 28px;
        font-weight: 700;
        color: white;
        letter-spacing: -0.5px;
        line-height: 1;
    }
    
    .logo-subtitle {
        font-size: 12px;
        color: rgba(255,255,255,0.6);
        margin-top: 4px;
    }
    
    .title-section {
        text-align: center;
        margin-bottom: 30px;
        width: 1000px;
    }
    
    .main-title {
        font-size: 84px;
        font-weight: 800;
        margin-bottom: 15px;
        letter-spacing: -2px;
        text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 50%, #2dd4bf 100%);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 4s ease-in-out infinite, fadeInUp 1s ease-out;
    }
    
    @keyframes gradientShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
    }
    
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-30px); }
        to { opacity: 1; transform: translateX(0); }
    }
    
    .subtitle {
        font-size: 28px;
        color: rgba(255,255,255,0.8);
        margin-bottom: 25px;
        font-weight: 300;
        animation: fadeInUp 1s ease-out 0.3s both;
    }
    
    .tagline {
        font-size: 18px;
        color: rgba(255,255,255,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        margin-top: 10px;
        animation: fadeInUp 1s ease-out 0.5s both;
    }
    
    .tagline span {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .tagline i {
        color: #3b82f6;
    }
    
    .stats-section {
        display: flex;
        gap: 40px;
        justify-content: center;
        width: 100%;
        animation: fadeInUp 1s ease-out 0.7s both;
    }
    
    .stat-item {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 25px 35px;
        text-align: center;
        min-width: 220px;
        height: 140px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }
    
    .stat-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(45, 212, 191, 0.1), transparent);
        transition: left 0.6s ease;
    }
    
    .stat-item:hover::before {
        left: 100%;
    }
    
    .stat-item:hover {
        transform: translateY(-5px);
        border-color: rgba(45, 212, 191, 0.4);
        box-shadow: 0 10px 30px rgba(45, 212, 191, 0.2);
    }
    
    .stat-number {
        font-size: 44px;
        font-weight: 700;
        color: #3b82f6;
        margin-bottom: 5px;
        font-variant-numeric: tabular-nums;
    }
    
    .stat-label {
        font-size: 16px;
        color: rgba(255,255,255,0.7);
    }
    
    .months-minutes-bar {
        margin-top: 30px;
        width: 800px;
        height: 85px;
        border-radius: 14px;
        background: linear-gradient(90deg, 
            rgba(30, 58, 138, 0.6) 0%, 
            rgba(17, 94, 89, 0.55) 100%);
        border: 1px solid rgba(45, 212, 191, 0.2);
        box-shadow: 
            0 12px 35px rgba(0, 0, 0, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        position: relative;
        overflow: hidden;
        animation: fadeInUp 1s ease-out 0.9s both;
    }

    .months-minutes-bar::before {
        content: "";
        position: absolute;
        top: -100%;
        left: -10%;
        width: 50%;
        height: 300%;
        background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
        pointer-events: none;
    }

    .months-minutes-bar::after {
        content: "";
        position: absolute;
        bottom: -100%;
        right: -10%;
        width: 50%;
        height: 300%;
        background: radial-gradient(circle, rgba(45,212,191,0.12) 0%, transparent 70%);
        pointer-events: none;
    }

    .months-text {
        font-size: 48px;
        font-weight: 800;
        color: #3b82f6;
        letter-spacing: -1px;
        line-height: 1;
        text-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
        position: relative;
        z-index: 2;
    }

    .arrow-icon {
        color: #2dd4bf;
        font-size: 34px;
        opacity: 0.95;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 0 8px rgba(45, 212, 191, 0.5));
        animation: arrowPulse 1.5s ease-in-out infinite;
    }
    
    @keyframes arrowPulse {
        0%, 100% { transform: translateX(0); opacity: 0.95; }
        50% { transform: translateX(8px); opacity: 1; }
    }

    .minutes-text {
        font-size: 48px;
        font-weight: 800;
        color: #2dd4bf;
        letter-spacing: -1px;
        line-height: 1;
        text-shadow: 0 0 25px rgba(45, 212, 191, 0.45);
        position: relative;
        z-index: 2;
    }
    
    .bottom-section {
        position: absolute;
        top: 640px;
        left: 60px;
        width: 1160px;
        height: 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid rgba(255,255,255,0.05);
        padding-top: 10px;
        z-index: 3;
        animation: fadeInUp 1s ease-out 1.1s both;
    }
    
    .company-info {
        display: flex;
        align-items: center;
        gap: 15px;
    }
    
    .company-logo {
        width: 40px;
        height: 40px;
        background: rgba(255,255,255,0.1);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 18px;
    }
    
    .company-text {
        font-size: 14px;
        color: rgba(255,255,255,0.7);
    }
    
    .company-name {
        font-weight: 600;
        color: white;
        font-size: 16px;
    }
    
    .date-info {
        font-size: 16px;
        color: rgba(255,255,255,0.6);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .decorative-circle {
        position: absolute;
        border-radius: 50%;
        border: 2px solid rgba(59, 130, 246, 0.2);
        pointer-events: none;
    }
    
    .circle-1 {
        width: 200px;
        height: 200px;
        top: 80px;
        left: 1000px;
        animation: pulse 3s infinite;
    }
    
    .circle-2 {
        width: 180px;
        height: 180px;
        top: 400px;
        left: 80px;
        animation: pulse 3s infinite 1s;
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
    }
    
    .platform-badge {
        position: absolute;
        top: 40px;
        left: 1100px;
        width: 120px;
        height: 38px;
        background: rgba(59, 130, 246, 0.2);
        border: 1px solid rgba(59, 130, 246, 0.3);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        z-index: 3;
        animation: slideInRight 0.8s ease-out;
    }
    
    @keyframes slideInRight {
        from { opacity: 0; transform: translateX(30px); }
        to { opacity: 1; transform: translateX(0); }
    }
    
    .platform-badge i {
        color: #3b82f6;
    }
    
    .platform-badge span {
        font-size: 13px;
        color: rgba(255,255,255,0.9);
        font-weight: 500;
    }
</style>
</head>
<body>
<div class="slide-container">
    <canvas id="particles"></canvas>
    <div class="bg-pattern"></div>
    <div class="grid-lines"></div>
    
    <div class="decorative-circle circle-1"></div>
    <div class="decorative-circle circle-2"></div>
    
    <div class="logo-section">
        <div class="logo-icon">
            <i class="fas fa-cube"></i>
        </div>
        <div>
            <div class="logo-text">NeXiO</div>
            <div class="logo-subtitle">Digital Engineering</div>
        </div>
    </div>
    
    <div class="platform-badge">
        <i class="fas fa-rocket"></i>
        <span>Phase 2</span>
    </div>
    
    <div class="main-content">
        <div class="title-section">
            <div class="main-title">NeXiO</div>
            <div class="subtitle">Digital Engineering Platform for MMA1 DCS Migration Phase 2</div>
            <div class="tagline">
                <span><i class="fas fa-shield-alt"></i> Reducing Engineering Risk</span>
                <span><i class="fas fa-cogs"></i> Improving Plant Reliability</span>
                <span><i class="fas fa-digital-tachograph"></i> Enabling SCGC Digital Engineering</span>
            </div>
        </div>
        
        <div class="stats-section">
            <div class="stat-item">
                <div class="stat-number" data-target="2811">0</div>
                <div class="stat-label">I/O Points</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" data-target="562">0</div>
                <div class="stat-label">Control Drawings</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" data-target="2433">0</div>
                <div class="stat-label">Modifications</div>
            </div>
        </div>

        <div class="months-minutes-bar">
            <span class="months-text">Months</span>
            <i class="fas fa-arrow-right arrow-icon"></i>
            <span class="minutes-text">Minutes</span>
        </div>
    </div>
    
    <div class="bottom-section">
        <div class="company-info">
            <div class="company-logo">
                <i class="fas fa-industry"></i>
            </div>
            <div class="company-text">
                <div class="company-name">SCGC</div>
                <div>Digital Transformation</div>
            </div>
        </div>
        <div class="date-info">
            <i class="far fa-calendar-alt"></i> 2026
        </div>
    </div>
</div>

<script>
    // Scaling
    function updateScale() {
        const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        document.documentElement.style.setProperty('--scale', scale);
    }
    window.addEventListener('resize', updateScale);
    updateScale();

    // Particle Network Effect
    (function() {
        const canvas = document.getElementById('particles');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = 1280;
        canvas.height = 720;
        
        const particles = [];
        const particleCount = 50;
        
        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                radius: Math.random() * 1.8 + 0.8
            });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 140) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(45, 212, 191, ${0.12 * (1 - dist / 140)})`;
                        ctx.lineWidth = 0.6;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(45, 212, 191, 0.5)';
                ctx.fill();
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
    })();

    // Animated Counters
    (function() {
        const counters = document.querySelectorAll('.stat-number[data-target]');
        
        function animateCounter(el, target) {
            const duration = 2000;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                const current = Math.floor(target * easeProgress);
                
                el.textContent = current.toLocaleString();
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }
        
        // Start after page load
        setTimeout(() => {
            counters.forEach(el => {
                const target = parseInt(el.getAttribute('data-target'));
                animateCounter(el, target);
            });
        }, 800);
    })();
</script>
</body>
</html>
