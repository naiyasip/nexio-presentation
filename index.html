<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>NeXiO Full Presentation</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000;
            font-family: 'Segoe UI', sans-serif;
        }

        .slide-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: scale(0.98);
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 212, 191, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .controls:hover {
            opacity: 1;
        }

        .btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover { 
            background: linear-gradient(135deg, #3b82f6, #2dd4bf); 
            color: white; 
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(45, 212, 191, 0.5);
        }
        
        .page-info {
            color: white;
            font-size: 15px;
            font-weight: 600;
            min-width: 70px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        .page-info span {
            color: #2dd4bf;
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #2dd4bf);
            transition: width 0.4s ease;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(45, 212, 191, 0.6);
        }

        /* Slide Counter Badge */
        .slide-badge {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 212, 191, 0.3);
            color: #2dd4bf;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .slide-badge:hover {
            opacity: 1;
        }

        /* =========================================================
           FULLSCREEN START OVERLAY
           ========================================================= */
        .start-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1b2a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .start-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .start-content {
            position: relative;
            text-align: center;
            z-index: 2;
        }

        .start-logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3b82f6, #2dd4bf);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 48px;
            color: white;
            box-shadow: 0 8px 40px rgba(45, 212, 191, 0.5);
            animation: logoPulse 2.5s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { 
                box-shadow: 0 8px 40px rgba(45, 212, 191, 0.5);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 8px 60px rgba(45, 212, 191, 0.9), 0 0 80px rgba(59, 130, 246, 0.5);
                transform: scale(1.05);
            }
        }

        .start-title {
            font-size: 64px;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 50%, #2dd4bf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .start-subtitle {
            font-size: 20px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 50px;
            font-weight: 300;
        }

        .start-btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 20px 50px;
            background: linear-gradient(135deg, #3b82f6, #2dd4bf);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(45, 212, 191, 0.4);
            letter-spacing: 1px;
            animation: btnBounce 2s ease-in-out infinite;
        }

        .start-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 40px rgba(45, 212, 191, 0.7);
        }

        @keyframes btnBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .start-hint {
            margin-top: 30px;
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.5px;
        }

        .start-hint i {
            color: #2dd4bf;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="progress-bar" id="progressBar"></div>
    <div class="slide-badge" id="slideBadge">NeXiO Presentation</div>

    <div class="slide-wrapper" id="container"></div>

    <div class="controls">
        <button class="btn" onclick="changeSlide(-1)"><i class="fas fa-chevron-left"></i></button>
        <div class="page-info"><span id="current">1</span> / 14</div>
        <button class="btn" onclick="changeSlide(1)"><i class="fas fa-chevron-right"></i></button>
    </div>

    <!-- =========================================================
         START OVERLAY - กดเพื่อเข้า Fullscreen
         ========================================================= -->
    <div class="start-overlay" id="startOverlay">
        <div class="start-content">
            <div class="start-logo">
                <i class="fas fa-cube"></i>
            </div>
            <div class="start-title">NeXiO</div>
            <div class="start-subtitle">Digital Engineering Platform Presentation</div>
            <button class="start-btn" id="startBtn">
                <i class="fas fa-expand"></i>
                START PRESENTATION
            </button>
            <div class="start-hint">
                <i class="fas fa-info-circle"></i>
                Click to enter fullscreen mode
            </div>
        </div>
    </div>

    <script>
        const fileNames = [
            'NeXiO_P1.html', 'NeXiO_P2.html', 'NeXiO_P3.html', 'NeXiO_P4.html', 'NeXiO_P5.html',
            'NeXiO_P6.html', 'NeXiO_P7.html', 'NeXiO_P8.html', 'NeXiO_P9.html', 'NeXiO_P10.html',
            'NeXiO_P11.html', 'NeXiO_P12.html', 'NeXiO_P13.html', 'NeXiO_P14.html'
        ];

        const slideTitles = [
            'Cover', 'Business Challenge', 'Demo - IO Assignment', 'Demo - Drawings',
            'The Solution', 'Core Functions', 'Demo - NeXiO Suite', 'Technology Breakthrough',
            'Platform Architecture', 'Why This Matters', 'Future Plan - X-PERMIT',
            'X-Permit Layout', 'Strategic Vision', 'Closing'
        ];

        let currentIndex = 0;
        const container = document.getElementById('container');

        // Preload all slides
        fileNames.forEach((file, index) => {
            const div = document.createElement('div');
            div.className = `slide ${index === 0 ? 'active' : ''}`;
            div.innerHTML = `<iframe src="${file}" loading="lazy"></iframe>`;
            container.appendChild(div);
        });

        const slides = document.querySelectorAll('.slide');

        function updateSlide() {
            slides.forEach((s, i) => {
                s.classList.toggle('active', i === currentIndex);
            });
            document.getElementById('current').innerText = currentIndex + 1;
            document.getElementById('slideBadge').innerText = slideTitles[currentIndex];
            document.getElementById('progressBar').style.width = 
                ((currentIndex + 1) / fileNames.length * 100) + '%';
        }

        function changeSlide(step) {
            currentIndex += step;
            if (currentIndex >= fileNames.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = fileNames.length - 1;
            updateSlide();
        }

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") {
                e.preventDefault();
                changeSlide(1);
            }
            if (e.key === "ArrowLeft") {
                e.preventDefault();
                changeSlide(-1);
            }
            // กด F เพื่อ toggle fullscreen
            if (e.key === "f" || e.key === "F") {
                toggleFullscreen();
            }
            // กด ESC ออกจาก fullscreen (browser handle เอง)
        });

        updateSlide();

        // =========================================================
        // FULLSCREEN FUNCTIONS
        // =========================================================
        function enterFullscreen() {
            const el = document.documentElement;
            
            if (el.requestFullscreen) {
                return el.requestFullscreen();
            } else if (el.webkitRequestFullscreen) {
                return el.webkitRequestFullscreen();
            } else if (el.msRequestFullscreen) {
                return el.msRequestFullscreen();
            }
            return Promise.reject('Fullscreen not supported');
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                return document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                return document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                return document.msExitFullscreen();
            }
            return Promise.reject('Exit fullscreen not supported');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                enterFullscreen().catch(err => {
                    console.warn('Fullscreen request denied:', err);
                });
            } else {
                exitFullscreen().catch(err => {
                    console.warn('Exit fullscreen failed:', err);
                });
            }
        }

        // =========================================================
        // START BUTTON - เข้า Fullscreen
        // =========================================================
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');

        function startPresentation() {
            // ซ่อน overlay
            startOverlay.classList.add('hidden');
            
            // ขอ Fullscreen
            enterFullscreen().catch(err => {
                console.warn('Fullscreen request was denied:', err);
                // ถ้าถูกบล็อก ยังคงแสดง presentation ต่อ (แต่ไม่ fullscreen)
            });
        }

        startBtn.addEventListener('click', startPresentation);
        startOverlay.addEventListener('click', startPresentation);

        // =========================================================
        // AUTO FULLSCREEN - ลองเข้าอัตโนมัติเมื่อโหลด
        // (บาง browser บล็อก จะแสดง overlay ให้กดแทน)
        // =========================================================
        window.addEventListener('load', () => {
            // ลองเข้าอัตโนมัติก่อน
            enterFullscreen().then(() => {
                // สำเร็จ - ซ่อน overlay
                startOverlay.classList.add('hidden');
            }).catch(() => {
                // ถูกบล็อก - แสดง overlay ให้ผู้ใช้กด
                console.log('Auto-fullscreen blocked. Waiting for user click.');
            });
        });

        // =========================================================
        // SYNC FULLSCREEN STATE
        // =========================================================
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // ออกจาก fullscreen แล้ว - แสดง overlay กลับมา? 
                // (หรือไม่ต้องทำอะไร เพื่อให้ผู้ใช้กด F กลับเข้าได้)
            }
        });

        // =========================================================
        // DOUBLE CLICK เข้า Fullscreen
        // =========================================================
        document.addEventListener('dblclick', () => {
            toggleFullscreen();
        });
    </script>
</body>
</html>
