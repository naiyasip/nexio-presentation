<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="NeXiO"/>
    <meta name="theme-color" content="#071426"/>
    <title>NeXiO Full Presentation</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            height: 100dvh; /* dynamic viewport height — ใช้พื้นที่จริงของจอมือถือ */
            overflow: hidden; 
            background: #000;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        /* รองรับ safe area (notch / home indicator) */
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        .slide-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: scale(0.98);
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* =========================================================
           Controls
           ========================================================= */
        .controls {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 212, 191, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            opacity: 0.35;
            transition: opacity 0.3s ease;
        }

        .controls:hover,
        .controls:active {
            opacity: 1;
        }

        .btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn:hover { 
            background: linear-gradient(135deg, #3b82f6, #2dd4bf); 
            color: white; 
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(45, 212, 191, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }
        
        .page-info {
            color: white;
            font-size: 15px;
            font-weight: 600;
            min-width: 70px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        .page-info span {
            color: #2dd4bf;
        }

        /* =========================================================
           Progress Bar
           ========================================================= */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #2dd4bf);
            transition: width 0.4s ease;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(45, 212, 191, 0.6);
            padding-top: env(safe-area-inset-top);
        }

        /* =========================================================
           Slide Counter Badge
           ========================================================= */
        .slide-badge {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 212, 191, 0.3);
            color: #2dd4bf;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.35;
            transition: opacity 0.3s ease;
        }

        .slide-badge:hover,
        .slide-badge:active {
            opacity: 1;
        }

        /* =========================================================
           QR CODE PANEL (มุมขวาบน)
           ========================================================= */
        .qr-panel {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 212, 191, 0.35);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0.35;
            transition: opacity 0.3s ease, transform 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .qr-panel:hover,
        .qr-panel:active {
            opacity: 1;
            transform: scale(1.05);
            border-color: rgba(45, 212, 191, 0.8);
            box-shadow: 0 8px 40px rgba(45, 212, 191, 0.5);
        }

        .qr-panel img {
            width: 90px;
            height: 90px;
            display: block;
            border-radius: 8px;
            background: #fff;
            padding: 5px;
        }

        .qr-label {
            font-size: 10px;
            color: #2dd4bf;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
        }

        .qr-label i {
            margin-right: 4px;
        }

        /* =========================================================
           FULLSCREEN START OVERLAY
           ========================================================= */
        .start-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1b2a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 40px 20px;
            padding-top: calc(40px + env(safe-area-inset-top));
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
        }

        .start-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .start-content {
            position: relative;
            text-align: center;
            z-index: 2;
            max-width: 100%;
        }

        .start-logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3b82f6, #2dd4bf);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 48px;
            color: white;
            box-shadow: 0 8px 40px rgba(45, 212, 191, 0.5);
            animation: logoPulse 2.5s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { 
                box-shadow: 0 8px 40px rgba(45, 212, 191, 0.5);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 8px 60px rgba(45, 212, 191, 0.9), 0 0 80px rgba(59, 130, 246, 0.5);
                transform: scale(1.05);
            }
        }

        .start-title {
            font-size: 64px;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 50%, #2dd4bf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .start-subtitle {
            font-size: 20px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 50px;
            font-weight: 300;
        }

        .start-btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 20px 50px;
            background: linear-gradient(135deg, #3b82f6, #2dd4bf);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(45, 212, 191, 0.4);
            letter-spacing: 1px;
            animation: btnBounce 2s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .start-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 40px rgba(45, 212, 191, 0.7);
        }

        .start-btn:active {
            transform: translateY(0) scale(0.98);
        }

        @keyframes btnBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .start-hint {
            margin-top: 30px;
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.5px;
        }

        .start-hint i {
            color: #2dd4bf;
            margin-right: 8px;
        }

        /* =========================================================
           QR CODE บน START OVERLAY
           ========================================================= */
        .start-qr {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(45, 212, 191, 0.3);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .start-qr:hover {
            border-color: rgba(45, 212, 191, 0.7);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(45, 212, 191, 0.3);
        }

        .start-qr img {
            width: 130px;
            height: 130px;
            border-radius: 10px;
            background: #fff;
            padding: 8px;
            display: block;
        }

        .start-qr-label {
            color: #2dd4bf;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .start-qr-label i {
            margin-right: 6px;
        }

        .start-qr-url {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            letter-spacing: 0.5px;
            font-family: 'Courier New', monospace;
        }

        /* =========================================================
           MOBILE FULLSCREEN BUTTON (มุมล่างซ้าย — สำหรับมือถือ)
           ========================================================= */
        .mobile-fs-btn {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 999;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(45, 212, 191, 0.3);
            color: #2dd4bf;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0.35;
            transition: opacity 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .mobile-fs-btn:hover,
        .mobile-fs-btn:active {
            opacity: 1;
        }

        /* =========================================================
           MOBILE / LANDSCAPE — ปรับ UI อัตโนมัติ
           ========================================================= */
        @media (max-width: 900px) {
            .slide-badge {
                top: 12px;
                left: 12px;
                font-size: 10px;
                padding: 6px 12px;
            }

            .qr-panel {
                top: 12px;
                right: 12px;
                padding: 8px;
                transform: scale(0.75);
                transform-origin: top right;
            }

            .qr-panel img {
                width: 70px;
                height: 70px;
            }

            .qr-label {
                font-size: 8px;
            }

            .controls {
                bottom: 12px;
                right: 12px;
                padding: 8px 14px;
                gap: 10px;
            }

            .btn {
                width: 34px;
                height: 34px;
                font-size: 13px;
            }

            .page-info {
                font-size: 13px;
                min-width: 55px;
            }

            .mobile-fs-btn {
                bottom: 12px;
                left: 12px;
                width: 34px;
                height: 34px;
                font-size: 12px;
            }
        }

        /* แนวนอนบนมือถือ — ย่อ UI ให้เล็กลงสุด */
        @media (max-width: 900px) and (orientation: landscape) {
            .slide-badge {
                top: 8px;
                left: 8px;
                font-size: 9px;
                padding: 4px 10px;
                letter-spacing: 1px;
            }

            .qr-panel {
                top: 8px;
                right: 8px;
                padding: 6px;
                transform: scale(0.6);
                transform-origin: top right;
            }

            .qr-panel img {
                width: 60px;
                height: 60px;
            }

            .qr-label {
                font-size: 7px;
            }

            .controls {
                bottom: 8px;
                right: 8px;
                padding: 6px 12px;
                gap: 8px;
            }

            .btn {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }

            .page-info {
                font-size: 12px;
                min-width: 50px;
            }

            .mobile-fs-btn {
                bottom: 8px;
                left: 8px;
                width: 30px;
                height: 30px;
                font-size: 11px;
            }

            .progress-bar {
                height: 2px;
            }

            .start-title {
                font-size: 42px;
            }

            .start-subtitle {
                font-size: 14px;
                margin-bottom: 25px;
            }

            .start-btn {
                padding: 14px 35px;
                font-size: 16px;
            }

            .start-logo {
                width: 70px;
                height: 70px;
                font-size: 32px;
                margin-bottom: 18px;
            }

            .start-qr {
                margin-top: 25px;
                padding: 12px 18px;
            }

            .start-qr img {
                width: 100px;
                height: 100px;
            }

            .start-hint {
                margin-top: 15px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="progress-bar" id="progressBar"></div>
    <div class="slide-badge" id="slideBadge">NeXiO Presentation</div>

    <!-- =========================================================
         QR CODE PANEL - มุมขวาบน (แสดงตลอดเวลา)
         ========================================================= -->
    <a class="qr-panel" 
       href="https://naiyasip.github.io/nexio-presentation/" 
       target="_blank" 
       rel="noopener noreferrer"
       title="Scan to open presentation link">
        <img 
            src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https%3A%2F%2Fnaiyasip.github.io%2Fnexio-presentation%2F&color=071426&bgcolor=FFFFFF&margin=0" 
            alt="QR Code - NeXiO Presentation">
        <div class="qr-label">
            <i class="fas fa-qrcode"></i>Scan Me
        </div>
    </a>

    <div class="slide-wrapper" id="container"></div>

    <div class="controls">
        <button class="btn" onclick="changeSlide(-1)"><i class="fas fa-chevron-left"></i></button>
        <div class="page-info"><span id="current">1</span> / 14</div>
        <button class="btn" onclick="changeSlide(1)"><i class="fas fa-chevron-right"></i></button>
    </div>

    <!-- =========================================================
         MOBILE FULLSCREEN BUTTON (มุมล่างซ้าย)
         ========================================================= -->
    <button class="mobile-fs-btn" id="mobileFsBtn" aria-label="Toggle fullscreen">
        <i class="fas fa-expand"></i>
    </button>

    <!-- =========================================================
         START OVERLAY - กดเพื่อเข้า Fullscreen
         ========================================================= -->
    <div class="start-overlay" id="startOverlay">
        <div class="start-content">
            <div class="start-logo">
                <i class="fas fa-cube"></i>
            </div>
            <div class="start-title">NeXiO</div>
            <div class="start-subtitle">Digital Engineering Platform Presentation</div>
            <button class="start-btn" id="startBtn">
                <i class="fas fa-expand"></i>
                START PRESENTATION
            </button>
            <div class="start-hint">
                <i class="fas fa-info-circle"></i>
                Tap to enter fullscreen mode
            </div>

            <!-- =============================================
                 QR CODE บน START OVERLAY
                 ============================================= -->
            <div class="start-qr">
                <img 
                    src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=https%3A%2F%2Fnaiyasip.github.io%2Fnexio-presentation%2F&color=071426&bgcolor=FFFFFF&margin=0" 
                    alt="QR Code - NeXiO Presentation">
                <div class="start-qr-label">
                    <i class="fas fa-mobile-alt"></i>Scan to view on mobile
                </div>
                <div class="start-qr-url">naiyasip.github.io/nexio-presentation</div>
            </div>

        </div>
    </div>

    <script>
        const fileNames = [
            'NeXiO_P1.html', 'NeXiO_P2.html', 'NeXiO_P3.html', 'NeXiO_P4.html', 'NeXiO_P5.html',
            'NeXiO_P6.html', 'NeXiO_P7.html', 'NeXiO_P8.html', 'NeXiO_P9.html', 'NeXiO_P10.html',
            'NeXiO_P11.html', 'NeXiO_P12.html', 'NeXiO_P13.html', 'NeXiO_P14.html'
        ];

        const slideTitles = [
            'Cover', 'Business Challenge', 'Demo - IO Assignment', 'Demo - Drawings',
            'The Solution', 'Core Functions', 'Demo - NeXiO Suite', 'Technology Breakthrough',
            'Platform Architecture', 'Why This Matters', 'Future Plan - X-PERMIT',
            'X-Permit Layout', 'Strategic Vision', 'Closing'
        ];

        let currentIndex = 0;
        const container = document.getElementById('container');

        // =========================================================
        // Preload slides
        // =========================================================
        fileNames.forEach((file, index) => {
            const div = document.createElement('div');
            div.className = `slide ${index === 0 ? 'active' : ''}`;
            div.innerHTML = `<iframe src="${file}" loading="lazy"></iframe>`;
            container.appendChild(div);
        });

        const slides = document.querySelectorAll('.slide');

        function updateSlide() {
            slides.forEach((s, i) => {
                s.classList.toggle('active', i === currentIndex);
            });
            document.getElementById('current').innerText = currentIndex + 1;
            document.getElementById('slideBadge').innerText = slideTitles[currentIndex];
            document.getElementById('progressBar').style.width = 
                ((currentIndex + 1) / fileNames.length * 100) + '%';
        }

        function changeSlide(step) {
            currentIndex += step;
            if (currentIndex >= fileNames.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = fileNames.length - 1;
            updateSlide();
        }

        // =========================================================
        // Keyboard Controls
        // =========================================================
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") {
                e.preventDefault();
                changeSlide(1);
            }
            if (e.key === "ArrowLeft") {
                e.preventDefault();
                changeSlide(-1);
            }
            if (e.key === "f" || e.key === "F") {
                toggleFullscreen();
            }
        });

        // =========================================================
        // Touch Swipe (บนมือถือ — ปัดซ้าย/ขวาเพื่อเปลี่ยนสไลด์)
        // =========================================================
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            touchStartTime = Date.now();
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            const deltaTime = Date.now() - touchStartTime;

            // ปัดแนวนอน (ซ้าย/ขวา) เป็นหลัก, ปัดเร็ว (< 400ms), ระยะ > 50px
            if (Math.abs(deltaX) > 50 && 
                Math.abs(deltaX) > Math.abs(deltaY) * 1.5 && 
                deltaTime < 400) {
                if (deltaX < 0) {
                    changeSlide(1);   // ปัดซ้าย → ถัดไป
                } else {
                    changeSlide(-1);  // ปัดขวา → ย้อนกลับ
                }
            }
        }, { passive: true });

        updateSlide();

        // =========================================================
        // FULLSCREEN FUNCTIONS
        // =========================================================
        function enterFullscreen() {
            const el = document.documentElement;
            
            if (el.requestFullscreen) {
                return el.requestFullscreen();
            } else if (el.webkitRequestFullscreen) {
                return el.webkitRequestFullscreen();
            } else if (el.msRequestFullscreen) {
                return el.msRequestFullscreen();
            }
            return Promise.reject('Fullscreen not supported');
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                return document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                return document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                return document.msExitFullscreen();
            }
            return Promise.reject('Exit fullscreen not supported');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                enterFullscreen().catch(err => {
                    console.warn('Fullscreen request denied:', err);
                });
            } else {
                exitFullscreen().catch(err => {
                    console.warn('Exit fullscreen failed:', err);
                });
            }
        }

        // =========================================================
        // START BUTTON → ซ่อน overlay + เข้า fullscreen
        // =========================================================
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');

        function startPresentation(e) {
            if (e) e.stopPropagation();

            // ซ่อน overlay
            startOverlay.classList.add('hidden');
            
            // ขอ Fullscreen (จาก user gesture — จะไม่ถูกบล็อก)
            enterFullscreen().catch(err => {
                console.warn('Fullscreen request was denied:', err);
            });

            // โฟกัสกลับมาที่ window เพื่อให้ keyboard ทำงาน
            window.focus();
        }

        startBtn.addEventListener('click', startPresentation);
        startOverlay.addEventListener('click', startPresentation);

        // =========================================================
        // MOBILE FULLSCREEN BUTTON
        // =========================================================
        const mobileFsBtn = document.getElementById('mobileFsBtn');
        mobileFsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });

        // =========================================================
        // DOUBLE CLICK เข้า Fullscreen
        // =========================================================
        document.addEventListener('dblclick', () => {
            toggleFullscreen();
        });

        // =========================================================
        // HANDLE ORIENTATION CHANGE (หมุนจอ)
        // =========================================================
        window.addEventListener('orientationchange', () => {
            // รอให้ browser คำนวณ layout ใหม่ก่อน
            setTimeout(() => {
                window.scrollTo(0, 0);
            }, 200);
        });
    </script>
</body>
</html>
